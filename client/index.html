<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniTwit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="login.js"></script>
</head>
<body>
<header class="header">
  <h1 class="title">MiniTwitter</h1>
</header>

<main class="main">
  <div class="box">
    <input id="username" type="text" placeholder="Benutzername" required />
    <input id="password" type="password" placeholder="Passwort" required />
    <button id="login">Anmelden</button>
    <span id="error" class="error-message"></span>
    <a href="register.html" class="link">
      Noch kein Konto? Jetzt registrieren
    </a>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2025 MiniTwit App</p>
</footer>
</body>
</html>
