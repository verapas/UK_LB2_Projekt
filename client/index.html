<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniTwitter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script defer src="login.js"></script>
</head>
<body>
<header class="header">
  <div class="header-content">
    <h1 class="title">MiniTwitter</h1>
  </div>
</header>

<main class="main">
  <div class="login-container box">
    <h2>Willkommen zurück</h2>
    <div class="form-group">
      <label for="username"><i class="fas fa-user"></i> Benutzername</label>
      <input id="username" type="text" placeholder="Dein Benutzername" required />
    </div>
    <div class="form-group">
      <label for="password"><i class="fas fa-lock"></i> Passwort</label>
      <input id="password" type="password" placeholder="Dein Passwort" required />
    </div>
    <button id="login" class="action-button">Anmelden</button>
    <span id="error" class="error-message"></span>
    <div class="register-link">
      <p>Noch kein Konto? <a href="register.html" class="link">Jetzt registrieren</a></p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-content">
    <p>MiniTwitter &copy; 2025</p>
  </div>
</footer>
</body>
</html>
