version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    volumes:
      - m223_project_mariadb:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=supersecret123
      - MYSQL_DATABASE=minitwitter
      - MYSQL_USER=minitwitter
      - MYSQL_PASSWORD=supersecret123
    ports:
      - 3306:3306
    healthcheck:
      test: mysqladmin ping -h localhost -u minitwitter -psupersecret123
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - mariadb
    restart: always
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=supersecret123
    ports:
      - 9200:80
      
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_HOST=mariadb
      - DB_USER=minitwitter
      - DB_PASSWORD=supersecret123
      - DB_NAME=minitwitter
    ports:
      - 4200:4200
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev:server"

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 35731:35731
    command: >
      sh -c "npm install && npm run dev:client"
    depends_on:
      - server
    restart: always

volumes:
  m223_project_mariadb:
  node_modules:
